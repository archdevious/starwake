<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starwake</title>
<style>
:root{
  --bg:#04060d; --panel:#0b1120ee; --panel2:#111a2e; --line:#22314f; --line2:#33476f;
  --text:#d9e3f5; --dim:#8695b3; --faint:#56627d; --acc:#5ad1ff; --acc2:#ffb84a; --good:#5be08a; --bad:#ff5d5d; --warn:#ffcf4a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(#1a2742,#121c32);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;color:var(--text);transition:.12s}
.btn:hover{border-color:var(--acc);color:#fff;box-shadow:0 0 10px #5ad1ff33}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;border-color:var(--line2)}
.btn.primary{background:linear-gradient(#1f6fa0,#13466c);border-color:#4ab6f0}
.btn.amber{background:linear-gradient(#a8661a,#6b3f0c);border-color:#ffb84a}
.btn.danger{background:linear-gradient(#8a2424,#561313);border-color:#ff6a6a}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.on{border-color:var(--acc2);color:var(--acc2)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.06em}
.dim{color:var(--dim)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)} .amber{color:var(--acc2)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{height:50px;display:flex;align-items:center;gap:14px;padding:0 12px;background:linear-gradient(#0d1528,#080d19);border-bottom:1px solid var(--line);z-index:5;flex-shrink:0}
.brand{font-weight:700;letter-spacing:.22em;font-size:15px;color:#fff;white-space:nowrap}
.brand b{color:var(--acc)}
#res{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
#res .chip{flex-shrink:0}#res .chip.rchip{flex-shrink:1;min-width:60px}.rchip .ell{min-width:0;overflow:hidden;text-overflow:ellipsis}
#attn{flex:1 0 auto;display:flex}#attn .chip{flex:1;justify-content:center}
.otag{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim,#8a94aa);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:3px;cursor:help}
.chip{display:flex;align-items:center;gap:6px;background:#0f182c;border:1px solid var(--line);border-radius:6px;padding:3px 9px;white-space:nowrap;font-size:13px}
.chip.click{cursor:pointer}.chip.click:hover{border-color:var(--acc)}
.chip .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tbtns{display:flex;gap:6px}
#main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:default;touch-action:none}
#side{position:absolute;top:10px;right:10px;bottom:10px;width:370px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;backdrop-filter:blur(6px);padding:12px;display:none;box-shadow:0 10px 40px #000a}
#side.show{display:block}
#side::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px}#side::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#24345a;border-radius:4px}
.zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:32px;height:32px;padding:0}
#hint{position:absolute;left:52px;bottom:12px;background:#0b1120dd;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--dim);pointer-events:none;max-width:60%}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#0f1a31f2;border:1px solid var(--acc);border-radius:8px;padding:7px 14px;opacity:0;transition:.25s;pointer-events:none;z-index:8}
#toast.show{opacity:1}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hdr h2{font-size:17px}
.x{background:none;border:none;color:var(--dim);font-size:18px;padding:0 4px}.x:hover{color:#fff}
.sec{margin:12px 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--line2)}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.wrap{flex-wrap:wrap}
.pball{width:30px;height:30px;border-radius:50%;flex-shrink:0;box-shadow:inset -6px -6px 10px #0009, 0 0 6px #fff1}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#1a2540;border:1px solid var(--line);color:var(--dim);margin:1px 2px 1px 0}
.tag.sp{color:var(--acc2);border-color:#5a4220}
.bar{height:7px;background:#0a1020;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f8fd0,#5ad1ff)}
.bar.g>i{background:linear-gradient(90deg,#2fa060,#5be08a)} .bar.r>i{background:linear-gradient(90deg,#a03030,#ff5d5d)} .bar.a>i{background:linear-gradient(90deg,#b06a10,#ffb84a)}
.jobs .row{margin:5px 0}.jobs .lbl{width:92px}.jobs .num{width:26px;text-align:center;font-weight:600}
.pips{display:flex;flex-wrap:wrap;gap:2px;flex:1}.pips i{width:9px;height:12px;border-radius:2px;display:block}
.small{font-size:12px}.tiny{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.qitem{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;background:#0d1426;border:1px solid var(--line);margin-bottom:3px;font-size:13px}
.qitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:13px}
.opt:hover{background:#18233d}
.opt .nm{flex:1}
select,input[type=text]{background:#0d1426;color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:4px 6px;font:inherit}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal.show{display:flex}
.mbox{background:linear-gradient(#0e1629,#090f1e);border:1px solid var(--line2);border-radius:12px;max-width:min(1100px,96vw);max-height:92vh;width:100%;display:flex;flex-direction:column;box-shadow:0 20px 80px #000}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:18px}
.mbody{padding:14px 16px;overflow:auto;flex:1}
.mfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
/* research */
.rfield{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.rname{width:118px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;padding:6px 8px;border-radius:7px;background:#0d1426;border-left:4px solid}
.rtiers{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:3px}
.rtier{min-width:150px;background:#0b1222;border:1px solid var(--line);border-radius:7px;padding:5px;display:flex;flex-direction:column;gap:4px}
.rtier.cur{border-color:var(--line2);background:#0f1930}
.rtier .tc{font-size:10px;color:var(--faint);display:flex;justify-content:space-between}
.tech{font-size:12px;padding:4px 6px;border-radius:5px;border:1px solid var(--line);background:#101a2f;line-height:1.25}
.tech.known{border-color:#2f7a4c;background:#0f2a1c;color:#bff5d2}
.tech.skip{opacity:.35;text-decoration:line-through}
.tech.avail{cursor:pointer;border-color:#3a5a8a}.tech.avail:hover{border-color:var(--acc);background:#14254a}
.tech.res{border-color:var(--acc2);background:#33240c;color:#ffe0a8}
.tech.lock{opacity:.5}
.tech .d{font-size:10.5px;color:var(--dim)}
/* design */
.dgrid{display:grid;grid-template-columns:230px 1fr 270px;gap:14px}
.dlist .opt.sel{background:#1a2a4a;border:1px solid var(--line2)}
.hullbtns{display:flex;gap:5px;flex-wrap:wrap}
.spacebar{height:14px;background:#0a1020;border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
.spacebar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#2f8fd0,#5ad1ff)}
.spacebar.over i{background:linear-gradient(90deg,#a03030,#ff5d5d)}
.wrow{display:flex;gap:6px;align-items:center;margin:4px 0}
.wrow select{flex:1}
.statt td{padding:2px 6px}.statt td:first-child{color:var(--dim)}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:5px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0c1426}
table.list td{padding:5px 6px;border-bottom:1px solid #16213a}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:#121d36}
.emp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:#0d1528}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-2px}
.msgi{display:flex;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);margin-bottom:5px;background:#0d1426;align-items:flex-start}
.msgi.click{cursor:pointer}.msgi.click:hover{border-color:var(--line2)}
.msgi .ic{width:20px;text-align:center}
/* title */
#title{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:radial-gradient(ellipse at 30% 20%,#1a2350 0%,#070a18 50%,#020308 100%)}
#title.show{display:block}
#titlebg{position:fixed;inset:0;width:100%;height:100%}
.tbox{position:relative;max-width:1060px;margin:0 auto;padding:30px 20px 40px}
.logo{text-align:center;margin:10px 0 4px;font-size:46px;font-weight:800;letter-spacing:.32em;color:#fff;text-shadow:0 0 30px #5ad1ff88}
.logo b{color:var(--acc)}
.sub{text-align:center;color:var(--dim);letter-spacing:.3em;font-size:12px;margin-bottom:24px}
.races{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.race{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0b1224cc;cursor:pointer;transition:.12s}
.race:hover{border-color:var(--line2)}
.race.sel{border-color:var(--acc);box-shadow:0 0 18px #5ad1ff44;background:#0f1d3acc}
.race h3{font-size:14px}
.race .sp{font-size:11px;color:var(--acc2);letter-spacing:.1em;text-transform:uppercase}
.race p{font-size:12px;color:var(--dim);margin:6px 0 0}
.setrow{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0;align-items:flex-end}
.setrow label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.colors{display:flex;gap:6px}
.colors i{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;display:block}
.colors i.sel{border-color:#fff}
.racepic{width:44px;height:44px;flex-shrink:0}
@media (max-width:820px){
  #side{left:6px;right:6px;top:auto;bottom:6px;width:auto;height:46%}
  .brand{display:none}
  .races{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:1fr}
  .emp{grid-template-columns:1fr}
  .logo{font-size:28px}
  #topbar{gap:6px;padding:0 6px;overflow-x:auto}
  .tbtns .btn{padding:4px 7px;font-size:12px}
}
/* ---- v2 additions ---- */
#news{position:absolute;left:10px;top:10px;width:340px;max-height:42%;overflow:auto;background:#0b1120e0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;display:none}
#news.show{display:block}
#news .ni{padding:4px 2px;border-bottom:1px solid #16213a;cursor:default}
#news .ni.click{cursor:pointer}#news .ni.click:hover{color:#fff}
#news .nh{display:flex;justify-content:space-between;align-items:center;color:var(--acc);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.camctl{position:absolute;left:10px;bottom:10px;display:flex;gap:4px}
.camctl .btn{height:32px;min-width:32px;padding:0 8px}
#hint{left:auto;right:390px;bottom:52px}
.body{display:flex;gap:9px;align-items:flex-start}
.facts{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.habtag{font-weight:600}
.era{max-width:960px;margin:0 auto}
.eraopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.eraopt{border:1px solid var(--line);border-radius:12px;padding:14px;background:#0b1224cc;cursor:pointer;transition:.12s}
.eraopt:hover{border-color:var(--line2)}
.eraopt.sel{border-color:var(--acc);box-shadow:0 0 18px #5ad1ff44;background:#0f1d3acc}
.eraopt h3{font-size:16px;margin-bottom:6px}
.eraopt p{color:var(--dim);font-size:13px;margin:0 0 8px}
.eraopt ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--acc2)}
.steps{display:flex;gap:6px;justify-content:center;margin:8px 0 4px}
.steps i{width:34px;height:4px;border-radius:2px;background:#22314f;display:block}
.steps i.on{background:var(--acc)}
.evt{font-size:14px;line-height:1.6}
.evt .choice{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px}
.tcol{display:flex;flex-direction:column;gap:6px;min-width:200px;flex:1}
.tgrid{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
.tech .req{font-size:10.5px;color:#ff9a7a}
.slotrow{display:flex;gap:6px;align-items:center;margin:4px 0}
.slotrow select{flex:1}

.chip .ell{max-width:150px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1700px){.chip .k{font-size:10px;letter-spacing:.04em}.chip{padding:3px 7px;gap:5px}}
.eraopt p.why{font-style:italic;color:#9fb0cc}
@media (max-width:1560px){#topbar .brand{display:none}}
@media (max-width:1440px){.tbtns .btn{padding:5px 8px;font-size:12.5px}.tbtns{gap:4px}#topbar{gap:8px}.chip .ell{max-width:110px}}
@media (max-width:1300px){.chip .k{display:none}.chip{padding:3px 6px}#res{gap:4px}}
.sdesc{font-size:13px;line-height:1.5;color:#c4cfe2;margin:8px 0 10px}
.nnum{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:#ffd678;color:#1a1206;font-weight:700;font-size:10.5px;text-align:center;margin-right:6px}
.setline{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.card.idlecard{border-color:#d04848;box-shadow:0 0 0 1px #d0484866 inset}
#news .nh .click{cursor:pointer}
#news .nh .click:hover .acc{text-decoration:underline}
.x.ren{font-size:13px;opacity:.55;vertical-align:middle}
.x.ren:hover{opacity:1}
#modal .ni{padding:5px 6px;font-size:13px;border-bottom:1px solid var(--line)}
#modal .ni.click{cursor:pointer}#modal .ni.click:hover{background:#13203a}
.iconbox{position:relative;border:1px solid var(--line);border-radius:10px;height:170px;background:radial-gradient(circle at 50% 45%,#13234a,#060a16);display:flex;align-items:center;justify-content:center}
.iconbox .lbl{position:absolute;left:10px;top:8px;font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.iconbox .arr{position:absolute;top:62px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:#13203a;color:#dfe7f5;cursor:pointer;font-size:12px}
.iconbox .arr:hover{border-color:var(--acc)}
.iconbox .inm{position:absolute;bottom:8px;width:100%;text-align:center;font-size:12.5px}
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw i{width:22px;height:22px;border-radius:5px;display:block;border:2px solid #2c3d63;cursor:pointer}.sw i.sel{border-color:#fff}
.colors{flex-wrap:wrap;max-width:330px}
#attn .chip{gap:7px}.attnnext{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.hkrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.hkrow .btn{min-width:110px}.hkrow .btn.cap{border-color:var(--acc);color:var(--acc)}
.chip.residle{border-color:#ff5d5d;box-shadow:0 0 0 1px #ff5d5d inset}
#news .ni.k-life,#modal .ni.k-life{background:#0f2a1a;border-left:3px solid #4fcf5f;padding-left:6px;color:#d8f5dc}
.mile .mtag{font-size:11px;letter-spacing:3px;color:#ffb84a;margin-bottom:6px}
.mile .mbd{display:flex;gap:16px}
.mile .mart{flex:none;width:150px;height:170px;background:#03070d;border:1px solid #1e3a4e;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mile .mart .civthumb{width:150px;height:170px}
.mile h3{margin:2px 0 8px;font-size:24px;font-weight:500;color:#eef6ff}
.mile p{font-size:14px;line-height:1.55;margin:0 0 10px;color:#c2d3e4}
.mile .mfx{margin-top:10px;padding:10px 12px;border:1px solid #23415a;border-radius:8px;font-size:13px;color:#9fd6ee;line-height:1.7}
#mapfilters{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
#mapfilters .btn{height:32px}
#news .ni.k-evgood,#modal .ni.k-evgood{background:#2a2410;border-left:3px solid #ffc94a;padding-left:6px;color:#fbefcf}
#news .ni.k-evbad,#modal .ni.k-evbad{background:#2c1216;border-left:3px solid #ff5d5d;padding-left:6px;color:#f8d6d6}

</style>
</head>
<body>
<div id="title"><canvas id="titlebg"></canvas><div class="tbox" id="tcontent"></div></div>
<div id="app" style="display:none">
  <div id="topbar">
    <div class="brand">STAR<b>WAKE</b></div>
    <div id="res"></div>
    <div class="tbtns">
      <button class="btn" data-a="openColonies" title="Colonies (C)">Colonies</button>
      <button class="btn" data-a="openResearch" title="Research (R)">Research</button>
      <button class="btn" data-a="openDesign" title="Ship Design (D)">Ships</button>
      <button class="btn" id="diplobtn" data-a="openDiplo" title="Diplomacy (P)" style="display:none">Diplomacy</button>
      <button class="btn" data-a="openJournal" title="Journal (J)">Journal</button>
      <button class="btn" data-a="openMenu">Menu</button>
      <button class="btn" id="ffwd" data-a="skip" title="Skip years until something happens (F)">Skip ⏩</button>
      <button class="btn primary" id="endturn" data-a="endTurn" title="End the year (Enter)">End Year ▸</button>
    </div>
  </div>
  <div id="main">
    <canvas id="map"></canvas>
    <div id="news"></div>
    <div id="side"></div>
    <div class="camctl"><button class="btn" data-a="camZoom" data-v="1" title="Zoom in">+</button><button class="btn" data-a="camZoom" data-v="-1" title="Zoom out">−</button><button class="btn" data-a="camRot" data-v="-1" title="Rotate left">⟲</button><button class="btn" data-a="camRot" data-v="1" title="Rotate right">⟳</button><button class="btn" data-a="camTop" title="Toggle top-down / tilted view">Top / Tilt</button><button class="btn" data-a="camSun" title="Centre on the Sun (H)">Sun</button><button class="btn" data-a="camFit" title="Show the whole map">Whole map</button></div>
    <div id="mapfilters"></div>
    <div id="hint"></div>
    <div id="toast"></div>
  </div>
</div>
<div id="modal"></div>

const STAR_ALIAS = {'Gliese 506': '61 Virginis', 'Gliese 83.1': 'TZ Arietis'};
const NUMW = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
const an = p => (/^[aeiou]/i.test(p) ? 'an ' : 'a ') + p;
const lc = t => t.toLowerCase().replace('sun-', 'Sun-').replace('earth', 'Earth').replace('neptune', 'Neptune');
function starFact(s) {
  const n = s.orig || s.name, t = STAR_DESC[n] || STAR_DESC[STAR_ALIAS[n]];
  if (t) return t;
  const w = lc(starKind(s.sp).word), cnt = s.cnt || s.c || 1;
  const a = an(w); return a[0].toUpperCase() + a.slice(1) + (cnt > 2 ? ' with two companion stars.' : cnt > 1 ? ' with a companion star.' : '.');
}
function worldPhrase(b) {
  let p = lc(TEMPS[b.temp] + ' ' + PCLASS[b.cls].name);
  if (lifeKnown(b) && b.life === 'ecosystem') p += ' with a living ecosystem';
  else if (lifeKnown(b) && b.life === 'microbial') p += ' with microbial life';
  return an(p);
}
function worldsSummary(s) {
  const all = s.bodies.map(B), bs = all.filter(b => !PCLASS[b.cls].belt);
  if (!bs.length) return all.length ? 'No planets, only a belt of dust and rock.' : 'No planets.';
  const rank = b => (lifeKnown(b) ? {ecosystem: 100, microbial: 50}[b.life] || 0 : 0) + ({garden: 40, livable: 30, harsh: 20, hostile: 10}[hab(b)] || 0) + (b.traits.some(t => t === 'rings' || t === 'subocean' || t === 'volcanic') ? 5 : 0) + b.size;
  const best = bs.slice().sort((a, b) => rank(b) - rank(a))[0], n = bs.length;

ACT.qdel = v => { const [bid, i] = v.split(':').map(Number); const c = B(bid).col; if (i === 0) c.prog = Math.floor(c.prog * 0.5); c.queue.splice(i, 1); renderSide(); };

function routeSetupHTML(f) {

    const pops = sid => ourColoniesAt(sid).reduce((t, b) => t + b.col.pop, 0);

function outpostPanel(b) {
  const c = b.col, o = colOut(b);
  const targets = ST(b.star).bodies.map(B).filter(x => x.owner === 0 && x.col && !x.col.outpost);
  const sup = supplyTarget(b);

    ${c.enslaved ? garrisonHTML(b) : ''}

    <div class="tiny dim" style="margin-top:3px">${sup ? `Sends ${r1(o.prod * supplyRate())} production a year to ${esc(sup.name)}'s build queue${supplyRate() < 1 ? ' (20% is lost in transport until Orbital Logistics)' : ''}.` : targets.length ? 'Builds its own projects and ships, or can supply a colony in this system.' : 'Builds its own projects and ships. With a colony in this system, it could supply that colony instead.'}</div>`;

  h += `<div class="sec">Building</div>`;
  if (c.queue.length) {
    const it = c.queue[0], cost = itemCost(b, it), k = buyCost(b);

      <div class="row sb small"><span class="dim">${Math.floor(c.prog)} / ${cost}</span><button class="btn sm amber" data-a="buy" data-v="${b.id}" ${S.bc < k || c.prog >= cost ? 'disabled' : ''}>Buy · ${k} credits</button></div></div>`;
    c.queue.forEach((q, i) => { h += `<div class="qitem"><span class="dim tiny">${i + 1}</span><span class="nm">${esc(itemName(q))}</span>${q.kind === 'ship' ? `<button class="btn sm" data-a="qn" data-v="${b.id}:${i}:-1">−</button><b class="small">${q.n || 1}</b><button class="btn sm" data-a="qn" data-v="${b.id}:${i}:1">+</button>` : ''}${i ? `<button class="x" data-a="qup" data-v="${b.id}:${i}">▲</button>` : ''}<button class="x" data-a="qdel" data-v="${b.id}:${i}">✕</button></div>`; });

  const tab = UI.buildTab;

  if (tab === 'proj') {

      if (P.giantOnly && b.cls !== 'gasgiant' && b.cls !== 'icegiant') continue; if (P.replaces && c.proj[P.replaces] == null && !P.req) continue; if (P.req === 'shallow' && c.proj.mines) continue;

    }
  } else {

  }
  return h;
}

const SKEY = s => 'starwake2.save.' + s;
function readSlot(s) { try { const r = localStorage.getItem(SKEY(s)); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function saveTo(slot) {
  try { const data = JSON.stringify(S, (k, v) => k[0] === '_' ? undefined : v);
    localStorage.setItem(SKEY(slot), JSON.stringify({format: SAVE_FORMAT, version: GAME_VERSION, saved: Date.now(), year: S.year, turn: S.turn, name: S.empire.name, color: S.empire.color, len: S.len, data})); return true;
  } catch (e) { console.warn('save failed', e); return false; }
}
function autosave() { if (S && !S.over) saveTo('auto'); }
function migrateSave(d) { d.version = GAME_VERSION; d.known = d.known || {}; for (const st of d.stars || []) d.known[st.id] = 1; if (!d.budget) d.budget = {perm: 0, temp: [], seen: {}}; { const ck = Object.keys(d.budget.seen || {}).filter(k => /^core\d+$/.test(k)); if (ck.length) { d.budget.perm -= ck.length - 1; ck.forEach(k => delete d.budget.seen[k]); d.budget.seen.core = 1; } } d.newsLog = d.newsLog || []; for (const x of d.designs || []) if (x.id === 'scout' && x.mods.length === 1 && x.mods[0] === 'tel_m') x.mods.push('booster'); for (const b of d.bodies || []) if (b.col && b.col.outpost && !b.col.mode) b.col.mode = 'build'; if ((d.designs || []).some(x => x.id === 'probe')) { for (const f of d.fleets || []) for (const sh of f.ships) if (sh.d === 'probe') sh.d = 'scout'; d.designs = d.designs.filter(x => x.id !== 'probe'); }
  for (const x of d.designs || []) delete x.obsolete; fixDesignIcons(d.designs || []); d.msgs = d.msgs || []; d.journal = d.journal || []; d.hist = d.hist || []; return d; }
function loadFrom(slot) { const r = readSlot(slot); if (!r) return false; try { S = migrateSave(JSON.parse(r.data)); ensureCivs(); updateKnowledge(true); } catch (e) { toast('That save could not be read.'); return false; } startPlaying(false); return true; }
function savesHTML(canSave) {
  let h = `<table class="list"><tr><th>Slot</th><th>Civilisation</th><th>Year</th><th>Saved</th><th></th></tr>`;
  for (const s of ['auto', 1, 2, 3, 4, 5]) { const r = readSlot(s);
    h += `<tr><td>${s === 'auto' ? 'Autosave' : 'Slot ' + s}</td><td>${r ? `<span class="swatch" style="background:${r.color}"></span> ${esc(r.name)} <span class="dim tiny">${LENGTHS[r.len] ? LENGTHS[r.len].label : ''}</span>` : '<span class="dim">Empty</span>'}</td><td>${r ? r.year : ''}</td><td class="small dim">${r ? new Date(r.saved).toLocaleString() : ''}</td>
      <td style="text-align:right;white-space:nowrap">${canSave && s !== 'auto' ? `<button class="btn sm" data-a="doSave" data-v="${s}">Save here</button> ` : ''}${r ? `<button class="btn sm primary" data-a="doLoad" data-v="${s}">Load</button> <button class="x" data-a="delSave" data-v="${s}">✕</button>` : ''}</td></tr>`; }
  return h + '</table><div class="tiny dim" style="margin-top:8px">The game autosaves every year. Saves are kept in this browser and carry over to new versions.</div>';
}

const HELP = `<div class="small" style="line-height:1.65">
<h3>The setting</h3><p>It is ${START_YEAR}, and you run Earth's space programme. Nothing goes faster than light: one year passes each turn, and your first ships fly at 30% of light speed, so a star 5 light-years away takes about 17 years to reach. The map uses real nearby stars at their real positions.</p>
<h3>Earth and the space budget</h3><p>Earth gives a share of its economy to space, shown on Earth's screen. It moves with events and some technologies. Earth only builds space projects, like ships and orbital structures.</p>

<h3>What's shared</h3><p>Production stays with each colony. Research and credits go into one empire-wide total. Food is shared by everything at the same star. Outposts can send their production to a colony in their system.</p>
<h3>Freighters</h3><p>A trade route between two of your systems carries settlers and food out and brings trade back. Short routes pay best.</p>
<h3>Staying on top</h3><p>The Idle button in the top bar counts colonies with nothing to build and ships waiting for orders. Each click (or its hotkey, Space unless changed) goes to the next one: colonies first, then ships, and round again. The research bar turns red when nothing is being researched.</p>
%ALIENS%<h3>Map controls</h3><p>Drag to rotate, right-drag or Shift-drag to pan, scroll to zoom. Stars sit on pins above or below a flat reference plane through the Sun. Click a star or ship; with a ship selected, click a star to send it.</p>
<h3>Keys</h3><p>%KEYS% · Esc: close. You can change these in Settings → Hotkeys.</p></div>`;
const ALIEN_HELP = `<h3>Other civilizations</h3><p>Some worlds hold <b>Prespacers</b>: civilizations from the stone age to the modern age that cannot reach space. A survey of their system finds them. Their homeworld and outposts cannot be settled while they are free.</p>
<p><b>Study</b>: a Science Lab ship in orbit learns their language from afar; it reveals their culture. <b>Landing party</b>: a Science Lab ship sends a team to meet them; they may attack it (safer once you know their language), which loses the ship's Science Lab. Ships and colonies in their system may be spotted.</p>

    body = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id}o)"/><g clip-path="url(#${id}c)"><rect ${rect} filter="url(#${id}f)"/><rect ${rect} filter="url(#${id}k)" opacity="0.9"/>`;
  } else {
    const pal = b.cls === 'ice' || b.temp === 'frozen' ? [0.8, 0.88, 0.96, '#b8ccd8', '#34495a'] : b.cls === 'moon' || b.cls === 'dwarf' ? [0.7, 0.7, 0.68, '#8e8e8a', '#2e2e2b'] : [0.9, 0.6, 0.4, '#9a6a46', '#3c2416'];
    if (b.atm && b.atm !== 'none') rim = '#ffb07a';
    defs += `<radialGradient id="${id}o" cx="38%" cy="34%" r="72%"><stop offset="0" stop-color="${pal[3]}"/><stop offset="1" stop-color="${pal[4]}"/></radialGradient>
      <filter id="${id}f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="5" seed="${seed}"/><feColorMatrix type="matrix" values="${pal[0]} 0 0 0 0.05  ${pal[1]} 0 0 0 0.04  ${pal[2]} 0 0 0 0.02  0 0 0 0 0.75"/></filter>
      <filter id="${id}k" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="${seed + 3}"/><feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0 0.04  2.6 0 0 0 -1.35"/></filter>`;
    body = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id}o)"/><g clip-path="url(#${id}c)"><rect ${rect} filter="url(#${id}f)"/><rect ${rect} filter="url(#${id}k)"/>`;
  }
  body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id}s)"/>`;
  if (o.lights) { const lx = cx + 18, ly = cy + 22; body += `<circle cx="${lx}" cy="${ly}" r="6" fill="url(#${id}l)" opacity="0.55"/>` + [[0, 0, 1.1], [-3, -2, 0.7], [3, 2, 0.7], [-2, 3, 0.6], [4, -2, 0.5], [-5, 1, 0.5]].map(([dx, dy, rr]) => `<circle cx="${lx + dx}" cy="${ly + dy}" r="${rr}" fill="#ffd88a"/>`).join(''); }
  body += `</g>`;
  if (rim) { defs += `<radialGradient id="${id}a" cx="50%" cy="50%" r="50%"><stop offset="0.86" stop-color="${rim}" stop-opacity="0"/><stop offset="0.92" stop-color="${rim}" stop-opacity="0.3"/><stop offset="1" stop-color="${rim}" stop-opacity="0"/></radialGradient>`; body = `<circle cx="${cx}" cy="${cy}" r="${r + 6}" fill="url(#${id}a)"/>` + body + `<circle cx="${cx}" cy="${cy}" r="${r + 0.5}" fill="none" stroke="${rim}" stroke-width="0.8" stroke-opacity="0.45"/>`; }
  if (o.ship) body += `<path d="M30 50 A62 18 -18 0 1 128 20" fill="none" stroke="#9fd6ee" stroke-width="0.6" stroke-opacity="0.35" stroke-dasharray="2 3"/><g transform="translate(112 25) rotate(-22)"><rect x="-7" y="-1.6" width="12" height="3.2" rx="1" fill="#c9d6e3"/><rect x="-10" y="-3.2" width="3.5" height="6.4" rx="0.6" fill="#8fa3b8"/><rect x="-2" y="-4.5" width="1.4" height="9" fill="#6f8aa3"/><circle cx="-11.5" cy="0" r="1.6" fill="#7fd4ff"/></g>`;
  return `<svg width="148" height="148" viewBox="0 0 140 140"><defs>${defs}</defs>${stars}${body}</svg>`;
}
const STAGE_WORDS = ['stone age', 'medieval age', 'industrial age', 'modern age'];
function milestoneHTML(p) {
  const s = ST(p.star), b = B(p.body);
  let title, text, art, extra = '';
  if (p.k === 'eco') { title = 'Life beyond Earth'; art = planetArt(b); text = [`Our survey of ${esc(s.name)} has found a living world. ${esc(b.name)} is covered in a diverse ecosystem: forests, oceans and alien animals we never knew could exist.`, 'For the first time, humanity knows Earth is not the only living world. The news is on every screen on Earth.']; }
  if (p.k === 'contact') { const c = (S.civs || []).find(x => x.id === p.civ), R = RACES[c.race]; title = 'We are not alone'; art = thumbSVG(); text = [`${p.how ? esc(p.how) : 'Our survey of ' + esc(s.name)} found a civilization on ${esc(b.name)}: the ${R.name}, a people in their ${STAGE_WORDS[c.stage]}. They cannot reach space, and they do not know we exist.`, 'Earth will never see the stars the same way again.']; extra = `<button class="btn" data-a="mclose" data-v="diplo">Open Diplomacy</button>`; }
  if (p.k === 'colony') { title = 'Humanity among the stars'; art = planetArt(b, {lights: true, ship: true}); text = [`${Math.round(p.pop * 1e6).toLocaleString()} settlers have founded a colony on ${esc(b.name)}. For the first time, people live and work under the light of another sun.`, 'Humanity is no longer a one-star species, and millions on Earth are inspired.']; }
  return {body: `<div class="mile"><div class="mtag">HISTORIC MOMENT · ${p.year}</div><div class="mbd"><div class="mart">${art}</div><div><h3>${title}</h3>${text.map(t => `<p>${t}</p>`).join('')}</div></div>${p.fx.length ? `<div class="mfx">${p.fx.map(esc).join('<br>')}</div>` : ''}</div>`,
    foot: `<button class="btn" data-a="mclose" data-v="go">Go to ${esc(p.k === 'colony' ? b.name : s.name)}</button>${extra}<button class="btn primary" data-a="mclose">Continue</button>`};
}
async function showMilestones() {
  while (S && S.popq && S.popq.length) {
    const p = S.popq.shift(); autosave();
    const h = milestoneHTML(p);
    sfx('turn');
    const pr = modal({w: 600, kind: 'mile', body: h.body, foot: h.foot});
    if (p.k === 'contact') { const cv = S.civs.find(x => x.id === p.civ); startThumb(cv.race, civColor(cv)); }
    const r = await pr;
    if (r === 'go') { centerOn(p.star); if (p.k === 'colony') selectColony(p.body); else selectStar(p.star); addPulse(p.star); }
    if (r === 'diplo') { ACT.openDiplo(p.civ); return; }
  }
}
function addPulse(sid) { UI.pulses = (UI.pulses || []).filter(p => p.star !== sid); UI.pulses.push({star: sid, t: performance.now()}); UI.dirty = true; }

// ----- Science Lab refit at a colony that can build ships -----
const REFIT_COST = MODULES.lab.cost; // full price of a Science Lab
function refitActions(f) {
  if (f.dest != null || !f.ships.some(sh => sh.lost && sh.lost.includes('lab'))) return [];
  if (f.task && f.task.type === 'refit') return [];
  const yard = ST(f.star).bodies.map(B).some(b => b.owner === 0 && b.col && (b.col.proj.shipyard || b.col.proj.dock));
  if (!yard) return [];
  return [`<button class="btn sm" data-a="refitLab" data-v="${f.id}" ${S.bc < REFIT_COST ? 'disabled' : ''} title="Takes 1 year; the ship must stay in orbit">Refit Science Lab (${REFIT_COST} credits, 1 yr)</button>`];
}
ACT.refitLab = v => { const f = FL(v); if (S.bc < REFIT_COST) return; S.bc = r1(S.bc - REFIT_COST); f.task = {type: 'refit', star: f.star, paid: REFIT_COST}; f.auto = false; renderSide(); renderTop(); toast('Refitting the Science Lab'); };
// ----- event decisions and effects on the colony panel -----
async function showDecisions() {
  const E = S.ev; if (!E || !E.decq) return;
  while (E.decq.length) {
    const d = E.decq[0];
    if (d.body != null && !(B(d.body) && B(d.body).owner === 0 && B(d.body).col)) { E.decq.shift(); continue; }
    const h = decisionHTML(d);
    if (!h) { E.decq.shift(); continue; }
    const btns = h.opts.map(([v, name], i) => `<button class="btn ${i === h.opts.length - 1 ? 'primary' : ''}" data-a="mclose" data-v="${v}" ${(v === 'pay' && S.bc < 50) || (v === 'take' && S.bc < 350) ? 'disabled title="Not enough credits"' : ''}>${name}</button>`).join('');
    const go = h.go != null ? `<button class="btn" data-a="mclose" data-v="go">Go to ${esc(B(h.go).name)}</button>` : '';
    const pr = modal({title: h.title + ' <span class="tiny" style="letter-spacing:2px;color:#ff9a7a;margin-left:8px">DECISION</span>', w: 480, noClose: true, kind: 'decision',
      body: `<div class="small" style="line-height:1.55">${h.text}</div>${h.opts.map(([v, name, eff]) => `<div class="card small" style="margin-top:8px"><b>${name}</b><div class="dim">${eff}</div></div>`).join('')}`, foot: go + btns});
    const r = await pr;
    if (r === 'go') { centerOn(B(h.go).star); selectColony(h.go); toast('The decision will reopen when you end the year.', 4000); return; }
    if (d.k === 'refugees') d.pick = UI.refPick;
    E.decq.shift(); resolveDecision(d, r); showNews(); refresh(); autosave();
  }
}
document.addEventListener('change', e => { if (e.target && e.target.id === 'refpick') UI.refPick = e.target.value; });
function eventFxHTML(b) {
  const c = b.col, out = [];
  for (const x of c.fx || []) {
    if (x.until && S.year >= x.until) continue;
    const parts = []; if (x.prod != null && x.prod !== 1) parts.push((x.prod > 1 ? '+' : '−') + Math.round(Math.abs(1 - x.prod) * 100) + '% production'); if (x.rp != null && x.rp !== 1) parts.push('+' + Math.round((x.rp - 1) * 100) + '% research');
    if (x.bc != null && x.bc !== 1) parts.push((x.bc > 1 ? '+' : '−') + Math.round(Math.abs(1 - x.bc) * 100) + '% credits'); if (x.grow === 0) parts.push('no growth'); else if (x.grow) parts.push('+' + Math.round((x.grow - 1) * 100) + '% growth'); if (x.keep) parts.push('keeps its own credits');
    const good = (x.prod || 1) >= 1 && (x.bc || 1) >= 1 && x.grow !== 0;
    out.push(`<div class="${good ? 'good' : 'bad'}">${esc(x.name)}: ${parts.join(', ')}${x.until ? ` · ${x.until - S.year} yr left` : ''}</div>`);
  }
  const inv = S.ev && S.ev.inv;
  if (inv && !inv.cured && inv.star === b.star) {
    const queued = c.queue.some(it => it.kind === 'cure');
    out.push(`<div class="bad">Invasive species: no growth, food output halved, half its research goes to the cure.</div><div class="bar" style="margin:4px 0"><i style="width:${Math.min(100, inv.prog / inv.need * 100)}%;background:#5be08a"></i></div><div class="tiny dim">Cure ${Math.floor(inv.prog / inv.need * 100)}% found</div>${queued ? '<div class="tiny">This colony\'s production is going to the cure.</div>' : `<button class="btn sm" data-a="queueCure" data-v="${b.id}" style="margin-top:4px">Put production toward the cure</button>`}`);
  }
  const cm = S.ev && S.ev.comet;
  if (cm && !cm.done && cm.body === b.id) {
    const queued = c.queue.some(it => it.kind === 'deflect');
    out.push(`<div class="bad">Comet strikes in ${cm.by - S.year} year${cm.by - S.year === 1 ? '' : 's'} unless the deflector (${cm.cost} production) is built.</div>${queued ? '' : `<button class="btn sm" data-a="queueDeflect" data-v="${b.id}" style="margin-top:4px">Build the deflector</button>`}`);
  }
  return out.length ? `<div class="sec">Events</div><div class="card small">${out.join('')}</div>` : '';
}
ACT.queueCure = v => { const b = B(+v); if (!b.col.queue.some(it => it.kind === 'cure')) b.col.queue.unshift({kind: 'cure'}); renderSide(); };
ACT.queueDeflect = v => { const b = B(+v); if (!b.col.queue.some(it => it.kind === 'deflect')) b.col.queue.unshift({kind: 'deflect'}); renderSide(); };

'use strict';
// ===================== STARWAKE v2 — GAME FLOW =====================
function refresh() { renderTop(); renderSide(); UI.dirty = true; }
function startPlaying(isNew) {
  $('#title').classList.remove('show'); $('#app').style.display = 'flex';
  UI.selFleet = null; UI.selStar = null; UI.view = null; closeSide(); FAR = null;
  requestAnimationFrame(() => {
    UI.cam.yaw = 0.6; UI.cam.pitch = 0.95; UI.cam.zoom = clamp(Math.min(mapSize().w, mapSize().h) / 30, 10, 40); centerOn(0);
    selectStar(0); refresh(); UI.busy = false; showNews();
    if (isNew) { autosave(); ACT.openIntro().then(() => { if (!S.res) ACT.openResearch(); }); }
  });
}
const FF_QUIET = new Set(['spot', 'info']);
async function runEndTurn(skip) {
  if (UI.busy || !S || S.over || modalOpen()) return;
  if (S.ev && S.ev.decq && S.ev.decq.length) { await showDecisions(); return; }
  UI.busy = true; $('#endturn').disabled = true; $('#ffwd').disabled = true; sfx('turn');
  try {
    let n = 0; const allMsgs = [];
    do {
      endTurn(); n++; allMsgs.push(...S.msgs);
      if (!skip) break;
      const loud = S.msgs.some(m => !FF_QUIET.has(m.kind)) || (!S.res && availableTechs().length) || S.over;
      if (loud) break;
    } while (n < 40);
    if (skip) S.msgs = allMsgs;
    autosave();
    refresh(); showNews(); newsSound(S.msgs);
    for (const m of S.msgs) if (m.kind === 'life' && m.star != null) addPulse(m.star);
    if (S.popq && S.popq.length) { await showMilestones(); if (modalOpen()) return; }
    if (S.ev && S.ev.decq && S.ev.decq.length) { await showDecisions(); if (modalOpen()) return; }
    if (S.over) { await showEnd(); return; }
    if (!S.res && availableTechs().length) await ACT.openResearch();
  } catch (e) { console.error(e); toast('Error: ' + e.message, 6000); }
  finally { if (!S.over) UI.busy = false; $('#endturn').disabled = false; $('#ffwd').disabled = false; refresh(); }
}
ACT.endTurn = () => runEndTurn(false);
ACT.skip = () => runEndTurn(true);
const KEY_DO = {endTurn: () => runEndTurn(false), skip: () => runEndTurn(true), idle: () => ACT.attnGo(), research: () => ACT.openResearch(),
  design: () => ACT.openDesign(), colonies: () => ACT.openColonies(), journal: () => ACT.openJournal(), home: () => centerOn(0),
  near: () => { if (SETTINGS.near > 0) { SETTINGS.nearLast = SETTINGS.near; SETTINGS.near = 0; } else SETTINGS.near = SETTINGS.nearLast || 3; saveSettings(); UI.dirty = true; renderSide(); toast(SETTINGS.near ? 'Nearest-star lines: ' + SETTINGS.near : 'Nearest-star lines off'); },
  diplo: () => ACT.openDiplo(),
  f_unexp: () => ACT.mapFilter('unexp'), f_chart: () => ACT.mapFilter('chart'), f_surv: () => ACT.mapFilter('surv'), f_trade: () => ACT.mapFilter('trade')};
document.addEventListener('keydown', e => {
  if (UI.keyCap && !modalOpen('hotkeys')) UI.keyCap = null;
  if (UI.keyCap) { e.preventDefault(); e.stopPropagation(); hotkeyCaptured(e); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') { if (modalOpen() && !UI.modalNoClose) ACT.mclose(); else { UI.selFleet = null; closeSide(); } return; }
  if (modalOpen() || $('#title').classList.contains('show') || !S) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const act = keyAction(normKey(e.key)); if (!act) return;
  e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!e.repeat || act === 'idle') KEY_DO[act]();
}, true);
// stop Space/Enter from also "clicking" a focused button when they are hotkeys
document.addEventListener('keyup', e => { if (!UI.keyCap && S && !modalOpen() && keyAction(normKey(e.key)) && e.target.tagName === 'BUTTON') e.preventDefault(); }, true);
keyTitles();
function titleBg() {
  const c = $('#titlebg');
  if (c && $('#title').classList.contains('show')) {
    const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
    if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
    const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
    const t = performance.now() / 1000;
    if (!titleBg.st) { titleBg.st = []; for (let i = 0; i < 500; i++) titleBg.st.push([Math.random(), Math.random(), Math.random() * 1.2 + 0.2, Math.random()]); }
    for (const [sx, sy, sr, tw] of titleBg.st) { const z = (sx + t * 0.01 * (0.3 + sr)) % 1; x.fillStyle = `rgba(200,215,255,${0.2 + 0.5 * Math.abs(Math.sin(t * 0.7 + tw * 9))})`; x.fillRect(z * W, sy * H, sr * 1.4, sr * 1.4); }
    const wx = ((t * 50) % (W + 600)) - 300, wy = H * 0.28;
    const g = x.createLinearGradient(wx - 300, wy, wx, wy); g.addColorStop(0, 'rgba(90,209,255,0)'); g.addColorStop(1, 'rgba(90,209,255,.35)');
    x.strokeStyle = g; x.lineWidth = 2; x.beginPath(); x.moveTo(wx - 300, wy + 30); x.quadraticCurveTo(wx - 120, wy + 5, wx, wy); x.stroke();
    x.fillStyle = '#d8f4ff'; x.beginPath(); x.arc(wx, wy, 2.5, 0, TAU); x.fill();
  }
  requestAnimationFrame(titleBg);
}
window.addEventListener('load', () => { initMapInput(); requestAnimationFrame(mapLoop); requestAnimationFrame(titleBg); showTitle(); });
