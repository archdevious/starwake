<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starwake</title>
<style>
:root{
  --bg:#04060d; --panel:#0b1120ee; --panel2:#111a2e; --line:#22314f; --line2:#33476f;
  --text:#d9e3f5; --dim:#8695b3; --faint:#56627d; --acc:#5ad1ff; --acc2:#ffb84a; --good:#5be08a; --bad:#ff5d5d; --warn:#ffcf4a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(#1a2742,#121c32);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;color:var(--text);transition:.12s}
.btn:hover{border-color:var(--acc);color:#fff;box-shadow:0 0 10px #5ad1ff33}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;border-color:var(--line2)}
.btn.primary{background:linear-gradient(#1f6fa0,#13466c);border-color:#4ab6f0}
.btn.amber{background:linear-gradient(#a8661a,#6b3f0c);border-color:#ffb84a}
.btn.danger{background:linear-gradient(#8a2424,#561313);border-color:#ff6a6a}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.on{border-color:var(--acc2);color:var(--acc2)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.06em}
.dim{color:var(--dim)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)} .amber{color:var(--acc2)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{height:50px;display:flex;align-items:center;gap:14px;padding:0 12px;background:linear-gradient(#0d1528,#080d19);border-bottom:1px solid var(--line);z-index:5;flex-shrink:0}
.brand{font-weight:700;letter-spacing:.22em;font-size:15px;color:#fff;white-space:nowrap}
.brand b{color:var(--acc)}
#res{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:6px;background:#0f182c;border:1px solid var(--line);border-radius:6px;padding:3px 9px;white-space:nowrap;font-size:13px}
.chip.click{cursor:pointer}.chip.click:hover{border-color:var(--acc)}
.chip .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tbtns{display:flex;gap:6px}
#main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:default;touch-action:none}
#side{position:absolute;top:10px;right:10px;bottom:10px;width:370px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;backdrop-filter:blur(6px);padding:12px;display:none;box-shadow:0 10px 40px #000a}
#side.show{display:block}
#side::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px}#side::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#24345a;border-radius:4px}
.zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:32px;height:32px;padding:0}
#hint{position:absolute;left:52px;bottom:12px;background:#0b1120dd;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--dim);pointer-events:none;max-width:60%}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#0f1a31f2;border:1px solid var(--acc);border-radius:8px;padding:7px 14px;opacity:0;transition:.25s;pointer-events:none;z-index:8}
#toast.show{opacity:1}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hdr h2{font-size:17px}
.x{background:none;border:none;color:var(--dim);font-size:18px;padding:0 4px}.x:hover{color:#fff}
.sec{margin:12px 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--line2)}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.wrap{flex-wrap:wrap}
.pball{width:30px;height:30px;border-radius:50%;flex-shrink:0;box-shadow:inset -6px -6px 10px #0009, 0 0 6px #fff1}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#1a2540;border:1px solid var(--line);color:var(--dim);margin:1px 2px 1px 0}
.tag.sp{color:var(--acc2);border-color:#5a4220}
.bar{height:7px;background:#0a1020;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f8fd0,#5ad1ff)}
.bar.g>i{background:linear-gradient(90deg,#2fa060,#5be08a)} .bar.r>i{background:linear-gradient(90deg,#a03030,#ff5d5d)} .bar.a>i{background:linear-gradient(90deg,#b06a10,#ffb84a)}
.jobs .row{margin:5px 0}.jobs .lbl{width:92px}.jobs .num{width:26px;text-align:center;font-weight:600}
.pips{display:flex;flex-wrap:wrap;gap:2px;flex:1}.pips i{width:9px;height:12px;border-radius:2px;display:block}
.small{font-size:12px}.tiny{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.qitem{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;background:#0d1426;border:1px solid var(--line);margin-bottom:3px;font-size:13px}
.qitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:13px}
.opt:hover{background:#18233d}
.opt .nm{flex:1}
select,input[type=text]{background:#0d1426;color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:4px 6px;font:inherit}
/* modal */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal.show{display:flex}
.mbox{background:linear-gradient(#0e1629,#090f1e);border:1px solid var(--line2);border-radius:12px;max-width:min(1100px,96vw);max-height:92vh;width:100%;display:flex;flex-direction:column;box-shadow:0 20px 80px #000}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:18px}
.mbody{padding:14px 16px;overflow:auto;flex:1}
.mfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
/* research */
.rfield{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.rname{width:118px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;padding:6px 8px;border-radius:7px;background:#0d1426;border-left:4px solid}
.rtiers{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:3px}
.rtier{min-width:150px;background:#0b1222;border:1px solid var(--line);border-radius:7px;padding:5px;display:flex;flex-direction:column;gap:4px}
.rtier.cur{border-color:var(--line2);background:#0f1930}
.rtier .tc{font-size:10px;color:var(--faint);display:flex;justify-content:space-between}
.tech{font-size:12px;padding:4px 6px;border-radius:5px;border:1px solid var(--line);background:#101a2f;line-height:1.25}
.tech.known{border-color:#2f7a4c;background:#0f2a1c;color:#bff5d2}
.tech.skip{opacity:.35;text-decoration:line-through}
.tech.avail{cursor:pointer;border-color:#3a5a8a}.tech.avail:hover{border-color:var(--acc);background:#14254a}
.tech.res{border-color:var(--acc2);background:#33240c;color:#ffe0a8}
.tech.lock{opacity:.5}
.tech .d{font-size:10.5px;color:var(--dim)}
/* design */
.dgrid{display:grid;grid-template-columns:230px 1fr 270px;gap:14px}
.dlist .opt.sel{background:#1a2a4a;border:1px solid var(--line2)}
.hullbtns{display:flex;gap:5px;flex-wrap:wrap}
.spacebar{height:14px;background:#0a1020;border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
.spacebar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#2f8fd0,#5ad1ff)}
.spacebar.over i{background:linear-gradient(90deg,#a03030,#ff5d5d)}
.wrow{display:flex;gap:6px;align-items:center;margin:4px 0}
.wrow select{flex:1}
.statt td{padding:2px 6px}.statt td:first-child{color:var(--dim)}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:5px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0c1426}
table.list td{padding:5px 6px;border-bottom:1px solid #16213a}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:#121d36}
.emp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:#0d1528}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-2px}
.msgi{display:flex;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);margin-bottom:5px;background:#0d1426;align-items:flex-start}
.msgi.click{cursor:pointer}.msgi.click:hover{border-color:var(--line2)}
.msgi .ic{width:20px;text-align:center}
/* title */
#title{position:fixed;inset:0;z-index:30;display:none;overflow:auto;background:radial-gradient(ellipse at 30% 20%,#1a2350 0%,#070a18 50%,#020308 100%)}
#title.show{display:block}
#titlebg{position:fixed;inset:0;width:100%;height:100%}
.tbox{position:relative;max-width:1060px;margin:0 auto;padding:30px 20px 40px}
.logo{text-align:center;margin:10px 0 4px;font-size:46px;font-weight:800;letter-spacing:.32em;color:#fff;text-shadow:0 0 30px #5ad1ff88}
.logo b{color:var(--acc)}
.sub{text-align:center;color:var(--dim);letter-spacing:.3em;font-size:12px;margin-bottom:24px}
.races{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.race{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0b1224cc;cursor:pointer;transition:.12s}
.race:hover{border-color:var(--line2)}
.race.sel{border-color:var(--acc);box-shadow:0 0 18px #5ad1ff44;background:#0f1d3acc}
.race h3{font-size:14px}
.race .sp{font-size:11px;color:var(--acc2);letter-spacing:.1em;text-transform:uppercase}
.race p{font-size:12px;color:var(--dim);margin:6px 0 0}
.setrow{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0;align-items:flex-end}
.setrow label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.colors{display:flex;gap:6px}
.colors i{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;display:block}
.colors i.sel{border-color:#fff}
.racepic{width:44px;height:44px;flex-shrink:0}
@media (max-width:820px){
  #side{left:6px;right:6px;top:auto;bottom:6px;width:auto;height:46%}
  .brand{display:none}
  .races{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:1fr}
  .emp{grid-template-columns:1fr}
  .logo{font-size:28px}
  #topbar{gap:6px;padding:0 6px;overflow-x:auto}
  .tbtns .btn{padding:4px 7px;font-size:12px}
}

</style>
</head>
<body>
<div id="title"><canvas id="titlebg"></canvas><div class="tbox" id="tcontent"></div></div>
<div id="app" style="display:none">
  <div id="topbar">
    <div class="brand">STAR<b>WAKE</b></div>
    <div id="res"></div>
    <div class="tbtns">
      <button class="btn" data-a="openColonies" title="Planets (P)">Planets</button>
      <button class="btn" data-a="openResearch" title="Research (R)">Research</button>
      <button class="btn" data-a="openDesign" title="Ship Design (D)">Ship Design</button>
      <button class="btn" data-a="openEmpires" title="Empires (E)">Empires</button>
      <button class="btn" data-a="openMenu">Menu</button>
      <button class="btn primary" id="endturn" data-a="endTurn" title="End turn (Enter)">End Turn ▸</button>
    </div>
  </div>
  <div id="main">
    <canvas id="map"></canvas>
    <div id="side"></div>
    <div class="zoom"><button class="btn" data-a="zoom" data-v="1" title="Zoom in">+</button><button class="btn" data-a="zoom" data-v="-1" title="Zoom out">−</button><button class="btn" data-a="fit" title="Show whole galaxy">⤢</button></div>
    <div id="hint"></div>
    <div id="toast"></div>
  </div>
</div>
<div id="modal"></div>
<script>
'use strict';
// ===================== STARWAKE — STATIC GAME DATA =====================
const GAME_VERSION = 1;
const SAVE_FORMAT = 1;

// fert = food produced per population unit; popF = habitability factor
const PT = {
  gaia:     {name:'Gaia',      fert:1.5,  popF:5, color:'#4fd06b', c2:'#1f7a3a'},
  terran:   {name:'Terran',    fert:1.25, popF:4, color:'#4a9be0', c2:'#2e7d3a'},
  ocean:    {name:'Ocean',     fert:1.25, popF:4, color:'#2f6fd8', c2:'#123a80'},
  jungle:   {name:'Jungle',    fert:1.0,  popF:3, color:'#5f9a3a', c2:'#2a4a14'},
  arid:     {name:'Arid',      fert:0.75, popF:3, color:'#d0a060', c2:'#7a5426'},
  tundra:   {name:'Tundra',    fert:0.75, popF:3, color:'#c4d4e0', c2:'#6a8090'},
  desert:   {name:'Desert',    fert:0.5,  popF:2, color:'#e3bc66', c2:'#9a6a24'},
  barren:   {name:'Barren',    fert:0,    popF:1, color:'#9a948c', c2:'#4a4642'},
  toxic:    {name:'Toxic',     fert:0,    popF:0, hostile:true, color:'#9fcf3a', c2:'#4a6a10'},
  radiated: {name:'Radiated',  fert:0,    popF:0, hostile:true, color:'#c25ae0', c2:'#5a1a70'},
  molten:   {name:'Molten',    fert:0,    popF:0, hostile:true, color:'#e8582e', c2:'#7a1a08'},
  gasgiant: {name:'Gas Giant', fert:0,    popF:0, outpostOnly:true, color:'#d6b088', c2:'#8a5a3a'},
  asteroids:{name:'Asteroid Belt', fert:0, popF:0, outpostOnly:true, color:'#8a8a8a', c2:'#444'},
};
const TERRAFORM = {toxic:'barren', radiated:'barren', molten:'barren', barren:'desert', desert:'arid', tundra:'arid', arid:'terran', jungle:'terran'};
const SIZE_NAMES = ['', 'Tiny', 'Small', 'Medium', 'Large', 'Huge'];
const SIZE_BASE = [0, 2, 4, 6, 8, 10];
const SIZE_SLOTS = [0, 2, 3, 4, 5, 6];
const MIN_NAMES = ['Ultra Poor', 'Poor', 'Abundant', 'Rich', 'Ultra Rich'];
const MIN_MULT = [0.5, 0.75, 1, 1.5, 2];

const STAR_TYPES = {
  yellow: {name:'Yellow', color:'#ffe27a', w:{terran:4, ocean:3, arid:3, jungle:2, tundra:2, desert:2, barren:2, gaia:1, toxic:1, molten:1, radiated:0.5, gasgiant:3, asteroids:2}},
  orange: {name:'Orange', color:'#ffb05a', w:{terran:2, ocean:2, arid:3, jungle:2, tundra:3, desert:3, barren:3, gaia:0.5, toxic:1, molten:1, radiated:1, gasgiant:3, asteroids:2}},
  red:    {name:'Red',    color:'#ff6a5a', w:{terran:1, ocean:1, tundra:4, barren:4, desert:2, jungle:2, toxic:2, radiated:1, molten:0.5, gasgiant:2, asteroids:2}},
  white:  {name:'White',  color:'#eef4ff', w:{terran:2, ocean:3, tundra:3, barren:3, arid:2, desert:2, radiated:2, toxic:2, molten:1, jungle:1, gasgiant:3, asteroids:2}},
  blue:   {name:'Blue',   color:'#7fb2ff', w:{molten:4, radiated:4, toxic:2, barren:3, desert:1, arid:1, terran:0.5, gasgiant:3, asteroids:3}},
};
const STAR_FREQ = {yellow:3, orange:3, red:4, white:2, blue:1};

const PSPECIAL = {
  gold:      {name:'Gold Deposits',     desc:'+5 credits per turn'},
  gems:      {name:'Crystal Veins',     desc:'+8 credits per turn'},
  artifacts: {name:'Precursor Ruins',   desc:'+5 research per turn; the first colony here uncovers a free tech'},
  fertile:   {name:'Fertile Soil',      desc:'+0.5 food per population'},
};

const RACES = [
  {id:'human',    name:'Terran Concord',     species:'Humans',   icon:'human',  bc:1.3, diplo:20,
    desc:'Adaptable traders and diplomats. +30% credits; other empires like them more.'},
  {id:'vashari',  name:'Vashari Collective', species:'Vashari',  icon:'vashari', research:1.5, attack:-1,
    desc:'Brilliant, frail scientists. +50% research, -1 ship attack.'},
  {id:'thrunn',   name:'Thrunn Hive',        species:'Thrunn',   icon:'thrunn', prodPop:0.5, growth:1.25, research:0.8, aggressive:1.3,
    desc:'Tireless insectoid workers. +0.5 production per population, +25% growth, -20% research.'},
  {id:'ixari',    name:'Ixari Dominion',     species:'Ixari',    icon:'ixari', attack:2, ground:1.5, aggressive:1.6,
    desc:'Born hunters. +2 ship attack, +50% ground troop strength.'},
  {id:'ondine',   name:'Ondine Tides',       species:'Ondine',   icon:'ondine', aquatic:true, foodPop:0.25,
    desc:'Amphibious. Ocean and Jungle worlds are paradise to them; +0.25 food per population.'},
  {id:'groak',    name:'Groak Monolith',     species:'Groak',    icon:'groak', lithovore:true, growth:0.6, aggressive:1.1,
    desc:'Silicon rock-eaters. Need no food and can live on any solid world, even hostile ones. -40% growth.'},
  {id:'myrrhine', name:'Myrrhine Aerie',     species:'Myrrhine', icon:'myrrhine', creative:true, research:0.85,
    desc:'Creative avians. Learn EVERY option in a tech tier at once. -15% research.'},
  {id:'selari',   name:'Selari Mind',        species:'Selari',   icon:'selari', defense:1, ground:2, bc:1.1, research:0.9,
    desc:'Telepaths. +1 ship defense, double ground troop strength, +10% credits, -10% research.'},
];
const RACE = {}; RACES.forEach(r => RACE[r.id] = r);
const EMP_COLORS = ['#4aa8ff', '#ff5a5a', '#5ad76a', '#ffd23f', '#c77dff', '#ff9f43', '#2ee6d6', '#ff6fb5'];

// ---------- Ship components ----------
const HULLS = {
  corvette:   {name:'Corvette',    space:25,  hp:8,   cost:10,  def:2,  armorMult:1,   cspeed:5, size:1, tech:null},
  destroyer:  {name:'Destroyer',   space:60,  hp:20,  cost:30,  def:1,  armorMult:2.5, cspeed:4, size:2, tech:null},
  cruiser:    {name:'Cruiser',     space:120, hp:40,  cost:60,  def:0,  armorMult:5,   cspeed:4, size:3, tech:'hull_cruiser', drydock:true},
  battleship: {name:'Battleship',  space:250, hp:80,  cost:120, def:-1, armorMult:10,  cspeed:3, size:4, tech:'hull_battleship', drydock:true},
  dreadnought:{name:'Dreadnought', space:500, hp:160, cost:250, def:-2, armorMult:20,  cspeed:3, size:5, tech:'hull_dreadnought', drydock:true},
};
const HULL_ORDER = ['corvette', 'destroyer', 'cruiser', 'battleship', 'dreadnought'];
const ARMOR = [
  {name:'Composite Plate', hp:5,  tech:null},
  {name:'Ceramite Plate',  hp:10, tech:'ceramite_armor'},
  {name:'Lattice Armor',   hp:18, tech:'lattice_armor'},
  {name:'Voidsteel Armor', hp:30, tech:'voidsteel_armor'},
];
const SHIELDS = [
  {name:'None', val:0, tech:null},
  {name:'Barrier Mk 1', val:1, tech:'barrier_1'},
  {name:'Barrier Mk 2', val:2, tech:'barrier_2'},
  {name:'Barrier Mk 3', val:3, tech:'barrier_3'},
  {name:'Barrier Mk 4', val:5, tech:'barrier_4'},
  {name:'Barrier Mk 5', val:7, tech:'barrier_5'},
];
const COMPUTERS = [
  {name:'None', val:0, tech:null},
  {name:'Targeting Array Mk 1', val:1, tech:'targeting_1'},
  {name:'Targeting Array Mk 2', val:2, tech:'targeting_2'},
  {name:'Targeting Array Mk 3', val:3, tech:'targeting_3'},
  {name:'Targeting Array Mk 4', val:4, tech:'targeting_4'},
  {name:'Targeting Array Mk 5', val:5, tech:'targeting_5'},
];
const DRIVES = [
  {name:'Chemical Thrusters', speed:2, tech:null},
  {name:'Ion Drive',          speed:3, tech:'ion_drive'},
  {name:'Fusion Drive',       speed:4, tech:'fusion_drive'},
  {name:'Fold Drive',         speed:5, tech:'fold_drive'},
  {name:'Lightwake Drive',    speed:6, tech:'lightwake_drive'},
  {name:'Starwake Drive',     speed:8, tech:'starwake_drive'},
];
const WEAPONS = {
  pulse_laser:     {name:'Pulse Laser',       type:'beam',    dmg:[1,4],   range:5, space:10, cost:3,  tech:null,                 color:'#ff4a4a'},
  railgun:         {name:'Railgun',           type:'beam',    dmg:[2,6],   range:6, space:12, cost:4,  tech:'railgun',            color:'#ffd060'},

const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

function wpick(w) { let t = 0, k; for (k in w) t += w[k]; let r = rnd() * t; for (k in w) { r -= w[k]; if (r <= 0) return k; } return k; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function genName(used) {

function randomPlanet(star, rich) {
  const type = wpick(STAR_TYPES[star.type].w);
  let size = +wpick({1:2, 2:3, 3:4, 4:2, 5:1});
  if (type === 'gasgiant') size = 5;
  if (type === 'asteroids') size = 1;
  const minerals = clamp(+wpick({0:1, 1:2, 2:4, 3:2, 4:1}) + (rich ? (rnd() < 0.5 ? 1 : 0) : 0), 0, 4);
  const p = newPlanet(star, type, size, minerals);
  if (rnd() < (rich ? 0.14 : 0.07) && !PT[type].outpostOnly) {
    p.special = wpick(PT[type].fert > 0 ? {gold:3, gems:2, artifacts:2, fertile:3} : {gold:3, gems:2, artifacts:2});

}
function genPoint(shape, w, h, ctx) {
  const cx = w / 2, cy = h / 2, rx = w / 2 - 1.4, ry = h / 2 - 1.4;
  if (shape === 'ring') { const a = rnd() * TAU, r = 0.58 + rnd() * 0.42; return [cx + Math.cos(a) * r * rx, cy + Math.sin(a) * r * ry]; }
  if (shape === 'spiral') {
    const arm = ri(0, ctx.arms - 1), t = Math.pow(rnd(), 0.8);
    const a = ctx.rot + arm * TAU / ctx.arms + t * 4.6 + gauss() * 0.06;
    const r = 0.12 + t * 0.88;
    return [cx + Math.cos(a) * r * rx + gauss() * 0.35, cy + Math.sin(a) * r * ry + gauss() * 0.35];
  }
  if (shape === 'clusters') { const c = pick(ctx.centers); return [c[0] + gauss() * ctx.sd, c[1] + gauss() * ctx.sd]; }
  const a = rnd() * TAU, r = Math.sqrt(rnd()); return [cx + Math.cos(a) * r * rx, cy + Math.sin(a) * r * ry];
}

// ---------------- Production ----------------
function bldCost(emp, id) { return Math.round(BUILDINGS[id].cost * (has(emp, 'civil_engineering') ? 0.8 : 1)); }

function itemName(emp, it) {

}

// ---------------- Planet defense / troops ----------------
function planetDefMax(pl) {

function troopStr(emp, attacking) { const r = R(emp); return (r.ground || 1) * (attacking ? (has(emp, 'assault_armor') ? 1.5 : 1) : (has(emp, 'personal_shields') ? 1.5 : 1)); }

// ---------------- Range / visibility ----------------
function distToOwned(emp, x, y) {
  let d = 1e9; for (const p of S.planets) if (p.owner === emp.id && p.star >= 0) { const s = ST(p.star); const dd = hyp(s.x, s.y, x, y); if (dd < d) d = dd; }
  return d;
}
function inRange(emp, starId) { const s = ST(starId); return distToOwned(emp, s.x, s.y) <= emp.range + 1e-6; }

// ---------------- Colonize / invade ----------------
function hostile(a, b) { if (a === b) return false; if (a === -1 || b === -1) return true; return E(a).rel[b].status === 'war'; }

}
function colonizeCheck(emp, f, pl) {
  if (pl.star !== f.star || f.dest != null) return 'Fleet must be in orbit';
  if (pl.owner != null && !(pl.owner === emp.id && pl.col.outpost)) return 'Planet is already claimed';
  if (hostileArmedAt(emp.id, pl.star)) return 'Hostile ships control this system';
  const mp = maxPop(emp, pl);

  if (pl.owner === emp.id) return (hasCol && mp > 0) ? null : 'Needs a Colony Ship to settle this outpost';

  return 'No Colony or Outpost Ship in this fleet';
}

}
function fleetTroops(f) { const emp = E(f.owner); let t = 0; for (const s of f.ships) { if (s.troopsUsed === S.turn) continue; t += shipStats(emp, designOf(emp, s.d)).troops || 0; } return t; }

// ---------------- Diplomacy ----------------
function declareWar(a, b) {
  const ra = a.rel[b.id], rb = b.rel[a.id];

  const broke = ra.treaty;
  ra.status = rb.status = 'war'; ra.treaty = rb.treaty = false; ra.warTurns = rb.warTurns = 0;
  rb.att -= 40;
  for (const o of alive()) if (o !== a && o !== b && o.rel[a.id].contact) o.rel[a.id].att -= broke ? 10 : 4;
  if (b.id === 0) S.msgs.push({text: 'The ' + a.name + ' have DECLARED WAR on us!', star: null, kind: 'war'});
  else if (a.id === 0) S.msgs.push({text: 'We are now at war with the ' + b.name + '.', star: null, kind: 'war'});
  else if (player().rel[a.id].contact && player().rel[b.id].contact) S.msgs.push({text: 'The ' + a.name + ' declared war on the ' + b.name + '.', star: null, kind: 'diplo'});
}
function makePeace(a, b) {

  ra.status = rb.status = 'peace'; ra.warTurns = rb.warTurns = 0; ra.att += 10; rb.att += 10;
  ra.peaceTurn = rb.peaceTurn = S.turn;

}
function signTrade(a, b) {

  if (a.id === 0 || b.id === 0) S.msgs.push({text: 'Trade treaty signed with the ' + (a.id === 0 ? b : a).name + '.', star: null, kind: 'diplo'});
}

function dipAsked(e) { const r = player().rel[e.id]; if (r.askedTurn === S.turn) { toast('They will not consider another proposal this turn.'); return true; } r.askedTurn = S.turn; return false; }

ACT.dipTrade = v => { const e = E(+v); if (dipAsked(e)) return; if (aiAcceptTrade(e, player())) { signTrade(player(), e); toast('Trade treaty signed.'); } else toast('The ' + e.name + ' decline.'); modalBody(empiresHTML()); };
ACT.dipDemand = v => {
  const e = E(+v); if (dipAsked(e)) return; const amt = tributeAmount(e);
  if (e.bc >= 20 && aiAcceptDemand(e, player())) { const got = payTribute(e, player(), amt); toast('The ' + e.name + ' pay ' + got + ' credits.'); }
  else { e.rel[0].att -= 15; toast('The ' + e.name + ' refuse, and are insulted.'); if (rnd() < 0.25) { declareWar(e, player()); toast('The ' + e.name + ' declare war!'); } }

};

async function handlePrompt(pr) {
  const e = E(pr.from); if (!e.alive) return;
  const head = `<div class="row"><img src="${emblemURL(e.raceId, e.color, 56)}" width="56"><div><h3 style="color:${e.color}">${esc(e.name)}</h3><div class="dim small">${R(e).species} · attitude ${attText(e.rel[0].att)}</div></div></div>`;
  if (pr.type === 'trade') {
    const v = await modal({title: 'Trade proposal', w: 520, noClose: true, body: head + `<p>The ${esc(e.name)} propose a trade treaty. Both empires earn extra credits each turn.</p>`, foot: `<button class="btn" data-a="mres" data-v="no">Decline</button><button class="btn primary" data-a="mres" data-v="yes">Accept</button>`});
    if (v === 'yes') signTrade(player(), e); else e.rel[0].att -= 3;
  } else if (pr.type === 'peace') {
    const v = await modal({title: 'Peace offer', w: 520, noClose: true, body: head + `<p>The ${esc(e.name)} offer to end the war.</p>`, foot: `<button class="btn" data-a="mres" data-v="no">Fight on</button><button class="btn primary" data-a="mres" data-v="yes">Make peace</button>`});
    if (v === 'yes') makePeace(player(), e);
  } else if (pr.type === 'demand') {
    if (player().rel[e.id].status === 'war') return;
    const v = await modal({title: 'Demand', w: 520, noClose: true, body: head + `<p>The ${esc(e.name)} demand <b class="amber">${pr.amount} credits</b> in tribute. Refusing will anger them and may mean war.</p><p class="dim small">You have ${Math.floor(player().bc)} credits. Their strength is about ${Math.round(empStrength(e) / Math.max(1, empStrength(player())) * 100)}% of yours.</p>`, foot: `<button class="btn danger" data-a="mres" data-v="no">Refuse</button><button class="btn primary" data-a="mres" data-v="yes">Pay</button>`});
    if (v === 'yes') { payTribute(player(), e, pr.amount); e.rel[0].att += 15; }
    else { e.rel[0].att -= 20; if (rnd() < 0.4) declareWar(e, player()); }
  }
}

function slotKey(s) { return 'starwake.save.' + s; }
function readSlot(s) { try { const raw = localStorage.getItem(slotKey(s)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveTo(slot) {
  try {
    const data = JSON.stringify(S, (k, v) => k[0] === '_' ? undefined : v);
    const p = player();
    localStorage.setItem(slotKey(slot), JSON.stringify({format: SAVE_FORMAT, version: GAME_VERSION, saved: Date.now(), turn: S.turn, name: p.name, race: R(p).species, color: p.color, data}));
    return true;
  } catch (e) { console.warn('save failed', e); return false; }
}
function autosave() { if (S && !S.over) saveTo('auto'); }
function migrateSave(d) {
  // future versions upgrade older saves here; every field added later gets a default
  d.version = GAME_VERSION; d.format = SAVE_FORMAT;
  d.hist = d.hist || []; d.prompts = []; d.pendingBattles = []; d.msgs = d.msgs || [];
  return d;
}
function loadFrom(slot) {
  const r = readSlot(slot); if (!r) return false;
  try { S = migrateSave(JSON.parse(r.data)); } catch (e) { toast('That save could not be read.'); return false; }
  startPlaying(false);
  return true;
}
function savesHTML(canSave) {

  for (const s of ['auto', 1, 2, 3, 4, 5]) {

      <td style="text-align:right;white-space:nowrap">${canSave && s !== 'auto' ? `<button class="btn sm" data-a="doSave" data-v="${s}">Save here</button> ` : ''}${r ? `<button class="btn sm primary" data-a="doLoad" data-v="${s}">Load</button> <button class="x" title="Delete" data-a="delSave" data-v="${s}">✕</button>` : ''}</td></tr>`;
  }

}

function drawHistoryChart(cv) {
  const dpr = window.devicePixelRatio || 1; const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const hist = S.hist; if (hist.length < 2) return;
  let max = 1; for (const r of hist) for (const k in r.p) max = Math.max(max, r.p[k]);
  const L = 44, B = 26, T = 10, Rr = 10;
  const x = i => L + (W - L - Rr) * i / (hist.length - 1), y = v => H - B - (H - B - T) * v / max;
  c.strokeStyle = '#22314f'; c.fillStyle = '#8695b3'; c.font = '11px Segoe UI, sans-serif'; c.lineWidth = 1;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; c.beginPath(); c.moveTo(L, y(v)); c.lineTo(W - Rr, y(v)); c.stroke(); c.textAlign = 'right'; c.fillText(Math.round(v), L - 6, y(v) + 4); }
  c.textAlign = 'center';
  const step = Math.max(1, Math.ceil(hist.length / 8));
  for (let i = 0; i < hist.length; i += step) c.fillText('T' + hist[i].t, x(i), H - 8);
  for (const e of S.empires) {
    c.strokeStyle = e.color; c.lineWidth = e.id === 0 ? 3 : 1.8; c.beginPath();
    hist.forEach((r, i) => { const v = r.p[e.id] || 0; i ? c.lineTo(x(i), y(v)) : c.moveTo(x(i), y(v)); }); c.stroke();
  }
}

'use strict';
// ===================== STARWAKE — BATTLE SCREEN =====================
const BUI = {B: null, s: 30, ox: 0, oy: 0, fx: [], disp: {}, pendingDeath: new Set(), pendingRetreat: new Set(), speed: 1, hover: null, waiting: false, log: [], resolve: null, skip: false};
const SQ3 = Math.sqrt(3);
function hexCenter(c, r) { return [BUI.ox + BUI.s * SQ3 * (c + 0.5 * (r & 1)) + BUI.s * SQ3 / 2, BUI.oy + BUI.s * 1.5 * r + BUI.s]; }
function pixToHex(x, y) {
  let best = null, bd = 1e9;
  for (let r = 0; r < BH; r++) for (let c = 0; c < BW; c++) { const [hx, hy] = hexCenter(c, r); const d = Math.hypot(hx - x, hy - y); if (d < bd) { bd = d; best = {c, r}; } }

}

'use strict';
// ===================== STARWAKE — GAME FLOW =====================
function refresh() { renderTop(); renderSide(); }
function startPlaying(isNew) {
  $('#title').classList.remove('show'); $('#app').style.display = 'flex';
  UI.selFleet = null; UI.selStar = null; UI.view = null; closeSide();
  BGSTARS = null;
  requestAnimationFrame(() => {
    fitGalaxy();
    const cap = P(player().capital); if (cap) { const s = ST(cap.star); UI.cam.z = Math.max(UI.cam.z, 34); centerOn(s.x, s.y); selectStar(s.id); }
    refresh();
    UI.busy = false;
    if (isNew) { autosave(); showReport(S.msgs, 'Welcome').then(() => { if (!player().res) ACT.openResearch(); }); }
  });
}
async function runEndTurn() {
  if (UI.busy || !S || S.over) return;
  if (modalOpen()) return;
  UI.busy = true; $('#endturn').disabled = true;
  try {
    endTurnStart();
    const battles = S.pendingBattles.slice(); S.pendingBattles = [];
    for (const sid of battles) await handleBattle(sid);
    endTurnFinish();
    refresh();
    for (const pr of S.prompts) await handlePrompt(pr);
    S.prompts = [];
    if (S.over) { autosave(); await showEnd(); return; }
    autosave();
    refresh();
    if (S.msgs.length) await showReport(S.msgs);
    if (!player().res && availableTechs(player()).length) await ACT.openResearch();
  } catch (e) { console.error(e); toast('Error: ' + e.message, 6000); }
  finally { if (!S.over) UI.busy = false; $('#endturn').disabled = false; refresh(); }
}
ACT.endTurn = () => runEndTurn();
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (modalOpen('battle')) { if (e.key === ' ') { e.preventDefault(); ACT.bEnd(); } return; }
  if (e.key === 'Escape') { if (modalOpen() && !UI.modalNoClose) ACT.mclose(); else { UI.selFleet = null; closeSide(); } return; }
  if (modalOpen() || $('#title').classList.contains('show') || !S) return;
  const k = e.key.toLowerCase();
  if (e.key === 'Enter') { e.preventDefault(); runEndTurn(); }
  else if (k === 'n') ACT.nextIdle();
  else if (k === 'r') ACT.openResearch();
  else if (k === 'd') ACT.openDesign();
  else if (k === 'p') ACT.openColonies();
  else if (k === 'e') ACT.openEmpires();
  else if (k === 'h') { const cap = P(player().capital); if (cap) { const s = ST(cap.star); centerOn(s.x, s.y); } }
});
ACT.zoom = v => { UI.cam.z = clamp(UI.cam.z * (+v > 0 ? 1.25 : 0.8), 8, 90); };
ACT.fit = () => fitGalaxy();
// title background
function titleBg() {
  const c = $('#titlebg'); if (!c) return;
  if ($('#title').classList.contains('show')) {
    const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
    if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
    const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
    const t = performance.now() / 1000;
    for (const [sx, sy, sr, tw] of bgStars()) {
      const z = (sx + t * 0.02 * (0.3 + sr)) % 1;
      x.fillStyle = `rgba(200,215,255,${0.2 + 0.5 * Math.abs(Math.sin(t * 0.7 + tw * 9))})`; x.fillRect(z * W, sy * H, sr * 1.4, sr * 1.4);
    }
    // a wake of light crossing
    const wx = ((t * 60) % (W + 600)) - 300, wy = H * 0.28;
    const g = x.createLinearGradient(wx - 300, wy, wx, wy); g.addColorStop(0, 'rgba(90,209,255,0)'); g.addColorStop(1, 'rgba(90,209,255,.35)');
    x.strokeStyle = g; x.lineWidth = 2; x.beginPath(); x.moveTo(wx - 300, wy + 30); x.quadraticCurveTo(wx - 120, wy + 5, wx, wy); x.stroke();
    x.fillStyle = '#d8f4ff'; x.beginPath(); x.arc(wx, wy, 2.5, 0, TAU); x.fill();
  }
  requestAnimationFrame(titleBg);
}
window.addEventListener('load', () => {
  initMapInput();
  requestAnimationFrame(mapLoop);
  requestAnimationFrame(titleBg);
  showTitle();
});
